<!doctype html>
<!-- PowerTerminal 사용법 영상 — pominal.com 이 이 파일을 '사용법 영상' 칸에 넣어 보여 준다.
     엔진은 크라우니클래스 영상설명서(km-CronwyClass/web/guide/video/player.html)를 그대로 가져왔고,
     PT 화면 그림·장면 대본만 새로 썼다. 화면은 캔버스 한 장에 직접 그린다(스크린샷 아님).
     목소리: 한국어 = km 목소리(narration.js), 영어 = 무료 영어 목소리(narration-en.js). 만드는 법은 narration/README.md -->
<html lang="ko">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='96' fill='url(%23g)'/%3E%3Cpath d='M150 190 L226 256 L150 322' fill='none' stroke='%23fff' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='268' y='304' width='110' height='30' rx='15' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* 보는 사람 전용: 주소에 무엇이 붙어 오든 늘 '목차와 영상만' 화면으로 연다 (원본의 공유 화면).
   아래 앱이 주소의 # 을 읽기 전에 고쳐 둔다. */
(function(){try{
  var h=(location.hash||'').replace('#','').split('-');
  var en=h.indexOf('en')>=0;
  var want='#share'+(en?'-en':'-ko');
  if(location.hash!==want) history.replaceState(null,'',location.pathname+location.search+want);
}catch(e){}})();
</script>
<style>
/* 보는 사람에게는 목차와 영상만 — 설정 · 대본 · 내보내기 · 공유 안내 · 비율/언어 단추를 모두 감춘다.
   (앱이 켜지기 전부터, 그리고 누가 body 의 표시를 떼어도 보이지 않게 body 표시에 기대지 않는다) */
.settings,.script,.out,#outMsg,.scenes,.head .fmt,.sharebar,.brand{display:none!important}
</style>
<meta charset="utf-8">
<title>PowerTerminal 사용법 영상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 좌측 레일(목차 → 설정) + 우측 무대(캔버스 한 장이 곧 영상). 영상 편집기 느낌의 다크 단일 테마. 폰에선 무대가 위, 레일이 아래. */
:root{
  color-scheme: dark;
  --bg:#0E0C12; --panel:#17151D; --panel-2:#201D28; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#F4F1F8; --ink-2:#BDB6CB; --ink-3:#8A8399;
  --brand:#8A38F5; --brand-l:#A855F7; --brand-2:#D53A6B; --pink-l:#F472B6;
  --grad:linear-gradient(135deg,#8A38F5 0%,#D53A6B 100%);
  --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; --info:#3B82F6;
  --sans:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r-md:10px; --r-xl:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-l);outline-offset:2px}
.app{max-width:1560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.app{grid-template-columns:minmax(0,1fr)}.rail{order:2;position:static!important;max-height:none!important}.main{order:1}}

/* ── 레일 ── */
.rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-xl);background:var(--panel);border:1px solid var(--line)}
.brand svg{width:40px;height:33px;flex:none}
.brand b{display:block;font-size:18px;letter-spacing:-.01em}
.brand span{display:block;font-size:16px;color:var(--ink-3)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:14px}
.panel>h2{margin:0 0 10px;font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:.08em}
.grp+.grp{margin-top:12px}
.grp h3{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.grp h3 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.vbtn{width:100%;display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 10px;border-radius:var(--r-md);border:0;background:none;text-align:left;cursor:pointer}
.vbtn:hover{background:var(--panel-2)}
.vbtn .n{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:16px;font-weight:700;background:var(--panel-2);color:var(--ink-2)}
.vbtn .t{flex:1;min-width:0}
.vbtn .t small{display:block;font-size:16px;color:var(--ink-3)}
.vbtn[aria-current="true"]{background:rgba(138,56,245,.16)}
.vbtn[aria-current="true"] .n{background:var(--grad);color:#fff}
.vsoon{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;color:var(--ink-3);font-size:16px}
.vsoon .n{width:28px;height:28px;border-radius:8px;border:1px dashed var(--line-2);display:grid;place-items:center}

/* 설정 */
.settings details{border-top:1px solid var(--line);padding-block:10px}
.settings details:first-of-type{border-top:0;padding-top:0}
.settings summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
.settings details[open] summary::after{transform:rotate(-135deg)}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.row>label{font-size:16px;color:var(--ink-2);min-width:64px}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--brand-l)}
.row output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
select,textarea{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r-md)}
select{flex:1;min-width:0;height:40px;padding:0 10px}
.segs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--panel-2);flex:1}
.segs button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--ink-2);cursor:pointer;font-weight:600}
.segs button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#bAuto{white-space:nowrap;font-size:15px}#bAuto[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:none;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--grad);color:#fff;font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;font-size:16px;color:var(--ink-2)}
.tog input{width:20px;height:20px;accent-color:var(--brand-l)}
.hint{margin:8px 0 0;font-size:16px;color:var(--ink-3);line-height:1.5}
.hint b{color:var(--ink-2)}
.script h2{margin:0;font-size:20px;letter-spacing:-.01em}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.shead>div{flex:1;min-width:0;max-width:72ch}
#bulkMsg:empty{display:none}
.narr{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.nitem{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.02);transition:border-color .15s,background .15s}
.nitem.on{border-color:rgba(168,85,247,.55);background:rgba(138,56,245,.07)}
.nitem.drag{border-color:var(--pink-l);background:rgba(244,114,182,.08)}
.nside{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.nside button{border:0;background:var(--panel-2);border-radius:10px;width:52px;height:44px;font-size:18px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.nside button:hover{background:var(--grad);color:#fff}
.nside small{font-size:16px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nmain{min-width:0}
@media (max-width:560px){.nitem{grid-template-columns:minmax(0,1fr)}.nside{flex-direction:row;align-items:center;gap:10px}}
.nhead{display:flex;align-items:center;gap:8px;font-size:16px}
.nhead b{font-weight:700}
.nhead .num{color:var(--ink-3);font-variant-numeric:tabular-nums}
.badge{margin-left:auto;font-size:16px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.badge.tts{color:var(--ink-3);background:rgba(255,255,255,.06)}
.badge.rec{color:#86EFAC;background:rgba(34,197,94,.14)}
.badge.live{color:#FCA5A5;background:rgba(239,68,68,.16)}
.nitem textarea{width:100%;margin-top:8px;min-height:64px;padding:8px 10px;resize:vertical;line-height:1.5}
.nbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.sbtn{min-height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.sbtn:hover{border-color:var(--brand-l)}
.sbtn.rec{color:#FCA5A5}
.sbtn.recording{background:#7F1D1D;border-color:#EF4444;color:#fff}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.nmsg{margin-top:6px;font-size:16px;color:var(--warn)}
.nmsg:empty{display:none}

/* ── 무대 ── */
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .eyebrow{font-size:16px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.head .eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--brand-l))}
.head h1{margin:2px 0 0;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
.head .meta{font-size:16px;color:var(--ink-3)}
.fmt{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.fmt button{min-height:40px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--ink-2);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.fmt button i{display:inline-block;border:2px solid currentColor;border-radius:3px}
.fmt button[aria-pressed="true"]{background:var(--grad);color:#fff}
.stagebox{display:flex;justify-content:center;background:#08070B;border:1px solid var(--line);border-radius:18px;padding:12px}
.stage{position:relative;overflow:hidden;border-radius:12px;background:#000;max-width:100%;cursor:pointer}
.stage.pc{width:100%;aspect-ratio:16/9}
.stage.short{height:min(74vh,880px);aspect-ratio:9/16}
.stage canvas{display:block;width:100%;height:100%}
.stage:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:default}
.stage:fullscreen canvas{width:auto;height:auto;max-width:100vw;max-height:100vh;aspect-ratio:var(--ar)}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,7,11,.35)}
.cover button{width:88px;height:88px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(14,12,18,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center}
.cover svg{width:32px;height:32px;margin-left:5px}
.busy{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(14,12,18,.85);border:1px solid rgba(239,68,68,.4);font-size:16px}
.busy i{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.25)}
.busy button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer}
.ctl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.ib{flex:none;width:42px;height:42px;border-radius:10px;border:0;background:var(--panel-2);cursor:pointer;display:grid;place-items:center}
.ib:hover{background:#2A2633}
.ib svg{width:18px;height:18px}
.tm{flex:none;min-width:104px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-2)}
#scrub{flex:1;min-width:0;accent-color:var(--brand-l);height:28px}
.scenes{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scenes button{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink-2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.scenes button b{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.scenes button[aria-current="true"]{border-color:rgba(168,85,247,.6);color:#fff;background:rgba(138,56,245,.14)}
.out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.out{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.out{grid-template-columns:minmax(0,1fr)}}
.obtn{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.obtn:hover{border-color:var(--brand-l)}
.obtn.primary{background:var(--grad);border-color:transparent;color:#fff}
.obtn svg{width:24px;height:24px;flex:none}
.obtn b{display:block}
.obtn small{display:block;font-size:16px;opacity:.8}
.notice{padding:12px 14px;border-radius:14px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);font-size:16px;line-height:1.55}
.notice .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.notice.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3)}
.notice.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
body.solo .app{grid-template-columns:minmax(0,1fr);max-width:1280px}
body.solo .rail{display:none}
/* 공유 화면 — 왼쪽 목차 + 오른쪽 영상만. 만드는 사람이 쓰는 설정·대본·내보내기는 숨긴다 */
body.share .settings,body.share .script,body.share .out,body.share #outMsg,body.share .scenes,body.share .head .fmt{display:none!important}
.sharebar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:rgba(138,56,245,.14);border:1px solid rgba(168,85,247,.45);font-size:16px;line-height:1.5}
body.share.preview .sharebar{display:flex}
.sharebar code{user-select:all;word-break:break-all;background:rgba(0,0,0,.3);padding:2px 8px;border-radius:8px}
.sharebar .sbtn{margin-left:auto}
/* 전체 내보내기 중 — 영상 바꾸기·설정을 잠근다 (그만 단추는 영상 위에 있다) */
body.batch .rail,body.batch .head .fmt,body.batch .ctl,body.batch .scenes,body.batch .script,body.batch .out{pointer-events:none;opacity:.45}
@media (prefers-reduced-motion:reduce){.settings summary::after{transition:none}}
/* ✅ 2026-10-09 CEO: 영상설명서 배경을 다른 페이지처럼 흰색으로. 목차 · 제목 글자는 흰 바탕에서 잘 보이는 진한 색
   (본문 #17131F 는 흰 바탕 대비 약 17:1, 가장 옅은 보조 글자 #5E566F 도 약 6.6:1 — 기준 4.5:1 이상). 영상 화면 자체는 그대로다. */
:root{
  color-scheme: light;
  --bg:#FFFFFF; --panel:#F7F5FB; --panel-2:#EDE8F5; --line:rgba(23,19,31,.10); --line-2:rgba(23,19,31,.20);
  --ink:#17131F; --ink-2:#3F3850; --ink-3:#5E566F;
}
.vbtn[aria-current="true"]{background:rgba(138,56,245,.12)}
.vbtn[aria-current="true"] .t{color:#5B21B6;font-weight:700}
.ib:hover{background:#DDD3EE}
.stagebox{background:var(--panel)}
.busy{color:#fff}.busy button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
</style>

<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <svg viewBox="0 0 64 52" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A38F5"/><stop offset="1" stop-color="#D53A6B"/></linearGradient></defs><path d="M8 42 L12 14 L24 27 L32 8 L40 27 L52 14 L56 42 Z" fill="url(#lg)"/><rect x="8" y="44" width="48" height="6" rx="3" fill="url(#lg)"/></svg>
      <div><b>PowerTerminal 사용법 영상</b><span>기본 · 요청 · AI 도구</span></div>
    </div>

    <nav class="panel" aria-label="영상 목차">
      <h2>목차</h2>
      <div id="toc"></div>
    </nav>

    <section class="panel settings" aria-label="설정">
      <h2>설정</h2>

      <details open id="dNarr">
        <summary>나레이션</summary>
        <div class="row"><label for="voice">임시 목소리</label><select id="voice"></select></div>
        <div class="row"><label for="rate">말 빠르기</label><input type="range" id="rate" min="0.8" max="1.4" step="0.05"><output id="rateO"></output></div>
        <div class="row"><label>쓸 소리</label>
          <div class="segs" role="group" aria-label="나레이션 소리 고르기">
            <button type="button" data-nm="rec">내 녹음</button>
            <button type="button" data-nm="tts">임시 목소리</button>
          </div>
        </div>
        <p class="hint">장면별 대사와 음성 파일은 영상 아래 <b>「장면별 나레이션 대본」</b>에서 바꿔요. 음성 파일이 없는 장면만 임시 목소리로 읽어요.</p>
      </details>

      <details id="dBgm">
        <summary>배경음</summary>
        <div class="chips" id="bgmChips" role="group" aria-label="배경음 고르기"></div>
        <div class="row"><button type="button" class="sbtn" id="bgmUp">내 음악 파일 올리기</button><span class="hint" id="bgmName" style="margin:0"></span></div>
        <div class="row"><label for="bgmVol">크기</label><input type="range" id="bgmVol" min="0" max="1" step="0.05"><output id="bgmVolO"></output></div>
        <label class="tog">말할 때 배경음 줄이기 <input type="checkbox" id="duck"></label>
      </details>

      <details id="dSfx">

const AU={ac:null};
function audioInit(){
  if(AU.ac)return AU.ac;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  const ac=new AC();AU.ac=ac;
  AU.out=ac.createGain();AU.out.gain.value=cfg.master;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.2;
  comp.connect(AU.out);AU.out.connect(ac.destination);
  try{AU.dest=ac.createMediaStreamDestination();AU.out.connect(AU.dest);}catch(e){AU.dest=null;}
  AU.music=ac.createGain();AU.music.gain.value=0;AU.music.connect(comp);
  AU.mlp=ac.createBiquadFilter();AU.mlp.type='lowpass';AU.mlp.frequency.value=5200;AU.mlp.connect(AU.music);
  AU.sfx=ac.createGain();AU.sfx.gain.value=cfg.sfxVol;AU.sfx.connect(comp);
  AU.narr=ac.createGain();AU.narr.gain.value=1.1;AU.narr.connect(comp);
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
  return ac;
}
function wake(){const ac=audioInit();if(ac&&ac.state==='suspended')ac.resume();return ac;}
function osc(type,f,t,dur,g,dest,o={}){const ac=AU.ac,v=ac.createOscillator(),e=ac.createGain();v.type=type;v.frequency.setValueAtTime(f,t);if(o.fEnd)v.frequency.exponentialRampToValueAtTime(o.fEnd,t+dur);if(o.detune)v.detune.value=o.detune;
  const a=o.a||.005;e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+a);if(o.hold)e.gain.setValueAtTime(g,t+a+o.hold);e.gain.exponentialRampToValueAtTime(.0001,t+dur);v.connect(e);e.connect(dest);v.start(t);v.stop(t+dur+.05);}
function noise(t,dur,g,dest,o={}){const ac=AU.ac,s=ac.createBufferSource();s.buffer=AU.noise;const bq=ac.createBiquadFilter();bq.type=o.type||'highpass';bq.frequency.setValueAtTime(o.f||6000,t);if(o.fEnd)bq.frequency.exponentialRampToValueAtTime(o.fEnd,t+dur);bq.Q.value=o.q||1;
  const e=ac.createGain(),a=o.a||Math.min(.008,dur/3);e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bq);bq.connect(e);e.connect(dest);s.start(t,Math.random()*.4);s.stop(t+dur+.05);}

const MUS={timer:null,src:null,custom:null,customName:''};
function musicStart(vt){
  musicStop();if(!AU.ac||cfg.bgm==='none')return;
  if(cfg.bgm==='custom'){if(!MUS.custom)return;const s=AU.ac.createBufferSource();s.buffer=MUS.custom;s.loop=true;s.connect(AU.mlp);s.start(AU.ac.currentTime+.02,vt%MUS.custom.duration);MUS.src=s;return;}

    const ch=capChunks(txt),tot=ch.reduce((a,c)=>a+c.length,0)||1;let acc=0;s._caps=ch.map(c=>{const a=acc;acc+=c.length;return{t:c,a:s._lead+s._nd*a/tot,b:s._lead+s._nd*acc/tot};});

const PL={playing:false,t:0,acStart:0,t0:0,raf:0,narr:[],spoken:-1,duckOn:null};
function now(){if(PL.playing&&AU.ac)return PL.t0+(AU.ac.currentTime-PL.acStart);return PL.t;}
function narrStart(vt){
  narrStop();if(!AU.ac)return;const v=V(),base=AU.ac.currentTime+.03;
  v.scenes.forEach(s=>{const r=recOf(v,s);if(!r||!r.buf||PL.skip===s.id)return;const ns=s._t0+s._lead,off=vt-ns;if(off>=r.buf.duration)return;
    const src=AU.ac.createBufferSource();src.buffer=r.buf;src.connect(AU.narr);src.start(base+Math.max(0,-off),Math.max(0,off));PL.narr.push(src);});
}
function narrStop(){PL.narr.forEach(s=>{try{s.stop();}catch(e){}});PL.narr=[];hush();}
function play(){
  const ac=wake();if(PL.t>=TOTAL-.05)PL.t=0;
  PL.playing=true;PL.started=true;$('cover').hidden=true;setPlayIcon();
  if(ac){PL.acStart=ac.currentTime;PL.t0=PL.t;narrStart(PL.t);musicStart(PL.t);PL.duckOn=null;}
  else{PL.acStart=performance.now()/1000;PL.t0=PL.t;}
  const sc=V().scenes,i=sceneAt(PL.t),s=sc[i];PL.spoken=(PL.t>s._t0+s._lead+.3)?i:i-1;
  if(PL.t>s._t0+s._lead+.3&&PL.t<s._t0+s._lead+s._nd*.4){PL.spoken=i;if(!recOf(V(),s))speak(narrText(V(),s));}
  PL.last=PL.t;cancelAnimationFrame(PL.raf);PL.raf=requestAnimationFrame(loop);
}
function pause(){if(!PL.playing)return;PL.t=now();PL.playing=false;cancelAnimationFrame(PL.raf);narrStop();musicStop();setPlayIcon();draw();}
function seek(t){const was=PL.playing;if(was)pause();PL.t=clamp(t,0,TOTAL);draw();if(was)play();}
function nowFallback(){return PL.t0+(performance.now()/1000-PL.acStart);}
function loop(){
  if(!PL.playing)return;let t=AU.ac?now():nowFallback();
  if(t>=TOTAL){PL.t=TOTAL;PL.playing=false;narrStop();musicStop();render(TOTAL-.001);setPlayIcon();uiTime(TOTAL);if(EXP.on)setTimeout(exportFinish,350);else if(cfg.pmode!=='off')setTimeout(afterEnd,700);return;}
  const v=V();
  // 효과음
  v.scenes.forEach(s=>s._events.forEach(([et,n])=>{if(et>PL.last&&et<=t)sfx(n);}));
  // 임시 목소리
  const i=sceneAt(t),s=v.scenes[i];
  if(i!==PL.spoken&&t>=s._t0+s._lead){PL.spoken=i;if(!recOf(v,s)&&PL.skip!==s.id)speak(narrText(v,s));}
  // 배경음 크기 (시작·끝 서서히 + 말할 때 줄이기)
  if(AU.ac){const inN=t>=s._t0+s._lead&&t<=s._t0+s._lead+s._nd;const fade=Math.min(1,t/1.5,(TOTAL-t)/2.5);
    const tg=Math.max(0,1.8*cfg.bgmVol*fade*(cfg.duck&&inN?.38:1));if(PL.duckOn===null||Math.abs(tg-PL.duckOn)>.01){AU.music.gain.setTargetAtTime(tg,AU.ac.currentTime,.12);PL.duckOn=tg;}}
  PL.last=t;render(t);uiTime(t);PL.raf=requestAnimationFrame(loop);
}

const RECD={mr:null,stream:null,sid:null,t0:0,timer:0};
async function narrAction(a,s,d,btn){
  const v=V(),k=recKey(v.id,s.id),msg=d.querySelector('.nmsg');msg.textContent='';
  if(a==='hear'){wake();const r=REC[k];if(r&&r.buf&&cfg.nm==='rec'){const src=AU.ac.createBufferSource();src.buffer=r.buf;src.connect(AU.narr);src.start();}else speak(narrText(v,s));return;}
  if(a==='del'){delete REC[k];await IDB.del('narr:'+k);afterAudio();return;}
  if(a==='go'){seek(s._t0+.01);if(!PL.playing)play();return;}
  if(a==='txt'){if(TX()[v.id])delete TX()[v.id][s.id];saveCfg();afterAudio();return;}
  if(a==='up'){pickFile('audio/*',async f=>{await storeNarr(k,f,msg);});return;}
  if(a==='rec'){
    if(RECD.mr){RECD.mr.stop();return;}
    try{if(!navigator.mediaDevices||!window.MediaRecorder)throw new Error('none');
      const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      pause();seek(s._t0+.01);RECD.stream=st;const chunks=[];const mr=new MediaRecorder(st);RECD.mr=mr;RECD.sid=s.id;
      mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      mr.onstop=async()=>{clearInterval(RECD.timer);st.getTracks().forEach(t=>t.stop());RECD.mr=null;btn.classList.remove('recording');btn.textContent='● 녹음';
        const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});await storeNarr(k,blob,msg);};
      mr.start();RECD.t0=Date.now();btn.classList.add('recording');btn.textContent='■ 멈추기 0초';
      RECD.timer=setInterval(()=>{btn.textContent='■ 멈추기 '+Math.floor((Date.now()-RECD.t0)/1000)+'초';},250);
    }catch(e){msg.textContent='이 화면에서는 마이크를 쓸 수 없어요. 휴대폰 녹음 앱으로 녹음해 「음성 파일 올리기」로 넣어 주세요.';}
  }
}
/* 같이 딸려 온 음성(narration.js)을 영상 하나치만 풀어 넣는다 — 전부 한꺼번에 풀면 오래 걸려서, 고른 영상부터 넣는다.
   내가 올린 녹음이 있거나 대사를 고친 장면은 건드리지 않는다. 새로 넣은 장면 수를 돌려준다 */
async function loadNarr(v){
  const N=(LANG==='en'?window.NARR_EN:window.NARR)||{},seen=new Set(),jobs=[];
  [...(v.full||v.scenes),...(v.short||[])].forEach(sc=>{const k=recKey(v.id,sc.id),it=N[k];if(!it||REC[k]||seen.has(k))return;seen.add(k);
    if(TX()[v.id]&&TX()[v.id][sc.id]!=null&&TX()[v.id][sc.id].trim()!==it.t)return;
    jobs.push((async()=>{try{const bin=atob(it.d.split(',')[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);const blob=new Blob([a],{type:'audio/mpeg'});
      const buf=await decodeBlob(blob);if(!REC[k]){REC[k]={buf,dur:buf.duration,blob,name:it.n||''};return 1;}}catch(e){}return 0;})());});
  return (await Promise.all(jobs)).reduce((x,y)=>x+y,0);
}
async function decodeBlob(blob){const ac=audioInit();const buf=await blob.arrayBuffer();return await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej);});}
async function storeNarr(k,blob,msg){
  try{const buf=await decodeBlob(blob);const name=blob.name||'';REC[k]={buf,dur:buf.duration,blob,name};await IDB.put('narr:'+k,{blob,name});afterAudio();return true;}
  catch(e){if(msg)msg.textContent='이 소리 파일은 읽을 수 없어요. mp3·m4a·wav 파일로 다시 올려 주세요.';return false;}
}

/* ───────────────────────── 내보내기 ───────────────────────── */
const MIME=(()=>{const list=[['video/mp4;codecs=avc1.640028,mp4a.40.2','mp4'],['video/mp4;codecs=avc1,mp4a','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9,opus','webm'],['video/webm','webm']];
  if(!window.MediaRecorder)return{type:null,ext:null,label:'이 브라우저는 영상 저장을 못 해요'};
  for(const [t,e] of list)if(MediaRecorder.isTypeSupported(t))return{type:t,ext:e,label:e==='mp4'?'MP4':'WEBM (크롬 최신판이면 MP4)'};return{type:'',ext:'webm',label:'WEBM'};})();
const EXP={on:false,rec:null,chunks:[],cancel:false,batch:false};
async function saveFile(name,blob){
  // 클로드 화면 안에서는 페이지가 직접 내려받지 못한다 — 내려받기 권한으로 건네고, 보는 사람이 확인해야 저장된다
  let d=null;try{if(window.claude&&window.claude.use)d=await window.claude.use('downloads');}catch(e){}
  if(d){for(let n=0;n<3;n++){try{await d.save({filename:name,data:blob});return 'saved';}catch(e){const c=e&&e.code;if(c==='declined')return 'declined';if(c!=='rate_limited')return 'fail';await new Promise(r=>setTimeout(r,2500));}}return 'fail';}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return 'saved';}catch(e){return 'fail';}
}
function outMsg(html,kind){$('outMsg').innerHTML=html?`<div class="notice ${kind||''}">${html}</div>`:'';}
function ttsScenes(v){v=v||V();return v.scenes.filter(s=>!recOf(v,s)).length;}
function canExport(){if(!MIME.type&&MIME.type!==''){outMsg('이 브라우저는 영상 파일 만들기를 지원하지 않아요. 크롬이나 엣지 최신판에서 열어 주세요.','bad');return false;}return true;}
function fileName(v,fmt){return `PowerTerminal-${tr(catOf(v).name)}-${tr(v.title)}-${fmt==='pc'?'PC':(LANG==='en'?'Shorts':'쇼츠')}.${MIME.ext}`.replace(/\s+/g,'_').replace(/[\\/:*?"<>|]/g,'');}
function askExport(){
  if(EXP.on||EXP.batch||!canExport())return;
  const n=ttsScenes();const L=LAYOUT[cfg.fmt];
  outMsg(`<b>${L.W}×${L.H} ${MIME.ext.toUpperCase()}</b> 파일 하나를 만들어요. 영상 길이만큼(<b>${fmtT(TOTAL)}</b>) 실제로 재생하면서 녹화하니, 끝날 때까지 이 탭을 앞에 띄워 두세요.`+
    (n?`<br>⚠ 장면 ${n}개가 <b>임시 목소리</b>예요. 브라우저 읽어주기는 영상 파일에 녹음되지 않아서 그 장면은 <b>자막·배경음·효과음만</b> 들어가요. 내 녹음을 넣으면 목소리까지 들어갑니다.`:'<br>모든 장면에 내 녹음이 들어 있어요. 목소리까지 함께 저장됩니다.')+
    `<div class="acts"><button type="button" class="sbtn" id="expGo" style="background:var(--grad);border:0;color:#fff">녹화 시작</button><button type="button" class="sbtn" id="expNo">취소</button></div>`);
  $('expGo').onclick=()=>exportStart(false);$('expNo').onclick=()=>outMsg('');
}
/* 지금 고른 영상을 지금 비율로 녹화해 파일 하나로 저장한다. 끝나면 결과를 돌려준다: {name,size} · 'cancel' · 'declined' · 'fail' · 'blocked' */
function exportStart(batch){
  return new Promise(async done=>{
    if(!batch)outMsg('');const ac=wake();if(ac&&ac.state!=='running'){try{await ac.resume();}catch(e){}}
    pause();PL.t=0;draw();
    try{const vs=cv.captureStream(30);const tracks=[...vs.getVideoTracks()];if(AU.dest)tracks.push(...AU.dest.stream.getAudioTracks());
      const opt={videoBitsPerSecond:cfg.fmt==='pc'?10e6:8e6,audioBitsPerSecond:192000};if(MIME.type)opt.mimeType=MIME.type;
      const rec=new MediaRecorder(new MediaStream(tracks),opt);EXP.chunks=[];EXP.rec=rec;EXP.on=true;EXP.cancel=false;
      rec.ondataavailable=e=>{if(e.data&&e.data.size)EXP.chunks.push(e.data);};
      rec.onstop=async()=>{EXP.on=false;$('busy').hidden=true;document.body.classList.remove('exporting');if(EXP.cancel){if(!batch)outMsg('영상 만들기를 멈췄어요.');done('cancel');return;}
        const blob=new Blob(EXP.chunks,{type:(MIME.type||'video/webm').split(';')[0]});EXP.chunks=[];const name=fileName(V(),cfg.fmt);
        const r=await saveFile(name,blob);
        if(!batch)outMsg(r==='saved'?`<b>${name}</b> 저장했어요 (${(blob.size/1048576).toFixed(1)}MB). 유튜브·인스타에 바로 올릴 수 있어요.`:r==='declined'?'저장을 취소했어요.':'저장하지 못했어요. 이 페이지를 크롬으로 직접 열어 다시 내보내 보세요.',r==='saved'?'ok':'bad');
        done(r==='saved'?{name,size:blob.size}:r);};
      rec.start(1000);$('busy').hidden=false;
      const label=batch||'영상 만드는 중';
      const tick=()=>{if(!EXP.on)return;$('busyT').textContent=label+' '+Math.round(now()/TOTAL*100)+'%';setTimeout(tick,300);};tick();
      setTimeout(play,250);
    }catch(e){EXP.on=false;if(!batch)outMsg('이 화면에서는 영상 녹화가 막혀 있어요. 이 페이지를 크롬으로 직접 열어 거기서 내보내 주세요.','bad');done('blocked');}
  });
}

async function exportAll(fmts){
  if(EXP.on||EXP.batch)return;
  const plan=batchPlan(fmts),back={video:cfg.video,fmt:cfg.fmt,pmode:cfg.pmode},okList=[],badList=[];let stopped=false;
  EXP.batch=true;document.body.classList.add('batch');cfg.pmode='off';
  for(let i=0;i<plan.length&&!stopped;i++){
    const [v,f]=plan[i];pause();cfg.video=v.id;cfg.fmt=f;PL.t=0;
    outMsg(`전체 내보내기 <b>${i+1} / ${plan.length}</b> — ${tr(v.title)} · ${FMT_NAME[f]}<br>저장 ${okList.length}개${badList.length?' · 실패 '+badList.length+'개':''}. 멈추려면 영상 위의 「그만」을 누르세요.`);

    (badList.length?`<br>저장하지 못한 것: ${badList.join(', ')}`:''),(!stopped&&!badList.length)?'ok':'bad');
}

  i.onchange=async()=>{const fs=[...i.files].sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));const v=V();let ok=0;$('bulkMsg').textContent='올리는 중…';
    for(let j=0;j<fs.length&&j<v.scenes.length;j++){if(await storeNarr(recKey(v.id,v.scenes[j].id),fs[j],null))ok++;}
    $('bulkMsg').textContent=`파일 이름 순서대로 ${ok}개 장면에 넣었어요 (01번 장면부터). 파일 이름 앞에 01, 02…를 붙여 두면 순서가 맞아요.`+(fs.length>v.scenes.length?` 장면보다 많은 ${fs.length-v.scenes.length}개는 넣지 않았어요.`:'');};i.click();};
$('bAll').onclick=askExportAll;$('bShare').onclick=()=>{if(EXP.on||EXP.batch)return;pause();outMsg('');shareEnter(true);};$('shareBack').onclick=shareLeave;
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||EXP.on||EXP.batch)return;
  if(e.key===' '){e.preventDefault();PL.playing?pause():play();}else if(e.key==='ArrowRight'){seek(now()+5);}else if(e.key==='ArrowLeft'){seek(now()-5);}});
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}else fillVoiceSelect();

(async function boot(){
  if(SOLO)document.body.classList.add('solo');
  if(SHARE){shareEnter(false);try{if(window.innerWidth<700&&window.innerHeight>window.innerWidth)cfg.fmt='short';}catch(e){}}
  rebuild();buildSettings();buildAll();fmtSet(cfg.fmt);pmodeSet(cfg.pmode);
  try{await document.fonts.load(`700 40px "IBM Plex Sans KR"`);await document.fonts.load(`500 20px "IBM Plex Sans KR"`);await document.fonts.load(`600 20px "IBM Plex Sans KR"`);}catch(e){}
  draw();
  // 저장해 둔 녹음·음악 불러오기
  try{
    if(SOLO){const d2b=u=>{const [h,b]=u.split(',');const m=h.match(/data:([^;]+)/);const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m?m[1]:'audio/webm'});};
      for(const k in (SOLO.audio||{})){const it=SOLO.audio[k];const blob=d2b(it.d||it);try{const buf=await decodeBlob(blob);REC[k]={buf,dur:buf.duration,blob,name:it.n||''};}catch(e){}}
      if(SOLO.bgm){const blob=d2b(SOLO.bgm);try{MUS.custom=await decodeBlob(blob);MUS.customBlob=blob;MUS.customName=SOLO.bgmName||'';}catch(e){}}}
    else{const keys=await IDB.keys();for(const key of keys||[]){if(typeof key!=='string')continue;
      if(key.startsWith('narr:')){const val=await IDB.get(key);const blob=val&&val.blob?val.blob:val;if(blob){try{const buf=await decodeBlob(blob);REC[key.slice(5)]={buf,dur:buf.duration,blob,name:(val&&val.name)||''};}catch(e){}}}
      if(key==='bgm:custom'){const blob=await IDB.get(key);if(blob){try{MUS.custom=await decodeBlob(blob);MUS.customBlob=blob;}catch(e){}}}
      if(key==='bgm:name')MUS.customName=await IDB.get(key)||'';}}
  }catch(e){}
  await loadNarr(V());
  if(cfg.bgm==='custom'&&!MUS.custom)cfg.bgm='tech';
  rebuild();buildSettings();buildAll();draw();
})();
setTimeout(async()=>{for(const v of VIDEOS){if(v.id===cfg.video)continue;await loadNarr(v);await new Promise(r=>setTimeout(r,120));}},1500);
window.__ccv={share:()=>SHARE,shareEnter,shareLeave,shareLink,batchPlan,fileName,exp:EXP,
  pick:id=>{pause();cfg.video=id;PL.t=0;rebuild();buildAll();draw();},scenes:()=>V().scenes.map(s=>({id:s.id,t0:s._t0,dur:s._dur})),videos:()=>VIDEOS.map(v=>v.id),
  miss:()=>[...TR_MISS],render:t=>{render(t);},total:()=>TOTAL,fmt:fmtSet,afterEnd,
  // 영상별 대사 목록 (음성 만들 때 씀): [영상id/장면id, 대사]
  lines:()=>VIDEOS.flatMap(v=>{const seen=new Set();return [...(v.full||v.scenes),...(v.short||[])].filter(q=>!seen.has(q.id)&&seen.add(q.id)).map(q=>[recKey(v.id,q.id),tr(q.narr)]);})};
})();
</script>
